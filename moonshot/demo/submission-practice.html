<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>브라우저 투고 연습</title><style>*{box-sizing:border-box}html{background:#f7f5ee;color:#19343c;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}body{margin:0}main{max-width:1120px;margin:auto;padding:40px 28px 90px}header{display:flex;justify-content:space-between;gap:25px;align-items:center;padding:20px 0;border-bottom:1px solid #cfd9d2}header a{font-weight:700}a{color:#206f65;text-underline-offset:5px}h1{font-size:clamp(36px,5vw,64px);line-height:1.27;letter-spacing:-2.2px;font-weight:800;margin:24px 0}h2{font-size:29px;letter-spacing:-.8px}h3{font-size:21px}p,li{font-size:18px;line-height:1.8;word-break:keep-all}small,.small{font-size:14px;line-height:1.7;color:#567167}button,.btn{border:1px solid #bfd0c6;background:#fffdf8;color:#1b4941;padding:14px 23px;border-radius:8px;font:700 17px/1.4 inherit;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:#237c72!important;color:#fff!important;border-color:#237c72!important}button:focus-visible,a:focus-visible{outline:3px solid #bb6f4e;outline-offset:4px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.eyebrow{font-size:14px;letter-spacing:2px;color:#237c72;font-weight:700}.hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;padding:50px 0}.hero img{width:100%;border-radius:10px}.rule{padding:35px 0;border-top:1px solid #ccd8d1}.two{display:grid;grid-template-columns:1fr 1fr;gap:35px}code{background:#e7ede4;padding:3px 6px;border-radius:3px;font-size:14px}pre{white-space:pre-wrap;font-size:16px;line-height:1.65;background:#fffdf8;border:1px solid #d4ddd4;padding:24px;overflow-wrap:anywhere;border-radius:8px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0}.panel{display:none}.panel.active{display:block}nav button[aria-selected=true]{background:#237c72;color:#fff}table{width:100%;border-collapse:collapse;font-size:17px}td,th{border-bottom:1px solid #cfdbd1;text-align:left;padding:15px}figure{margin:25px 0}figure img{width:100%;height:auto}.label{color:#236e63;font-weight:700}.callout{border-left:4px solid #ba7255;padding:8px 22px;background:#efeade}.note{background:#e7efe7;padding:20px;border-radius:8px}.files a{display:block;padding:10px 0}.prompt{width:100%;min-height:180px;font:17px/1.7 inherit;padding:20px;background:#fffdf8;border:1px solid #cbd9cd}label{display:block;margin:18px 0;font-size:17px}input[type=text]{display:block;width:100%;font:17px/1.5 inherit;padding:14px;border:1px solid #bfd0c6;margin-top:9px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}footer{border-top:1px solid #cfdbd3;padding-top:24px;margin-top:50px;font-size:13px;color:#587067}[hidden]{display:none!important}@media(max-width:650px){main{padding:20px 18px 60px}.hero,.two{grid-template-columns:1fr;gap:18px}.hero{padding:20px 0}.hero img{max-height:260px;object-fit:cover}header{font-size:13px}p,li{font-size:16px}h1{font-size:37px}nav button{font-size:14px;padding:9px 12px}pre{font-size:14px;padding:16px}td,th{padding:9px;font-size:14px}}</style></head><body><main><header><a href="index.html">← 실행 사례</a><span>브라우저 투고 연습</span></header><p class="eyebrow">LOCAL PRACTICE</p><h1>업로드 다음에는<br>접수 기록까지.</h1><p class="note">실제 저널이 아닙니다. 파일은 서버에 전송하지 않고 이 브라우저 안에서만 확인합니다.</p><p><a href="teaching-package.zip" download>먼저 교육용 파일 묶음을 내려받으세요.</a> 에이전트가 브라우저를 사용할 수 있으면 파일 선택·입력도 맡길 수 있습니다.</p><form><label>연습 원고 제목<input id="title" type="text" required maxlength="200" value="교육용 합성 사례: 걷기 앱 알림과 걸음수 변화"></label><label>내려받은 teaching-package.zip<input id="upload" type="file" accept=".zip" required></label><p id="file-status" role="status">파일을 선택해 주세요.</p><label><input type="checkbox" id="reviewed" required>실제 최종 파일을 열어 확인했고, 실제 투고가 아닌 연습임을 이해했습니다.</label><button type="submit" class="primary" id="submit" disabled>연습 제출</button></form><section id="receipt" hidden><h2>브라우저 연습 접수 확인</h2><pre id="receipt-text"></pre><button id="save">연습 접수 기록 저장</button><p>실제 학술지에서는 해당 서비스의 접수 번호·시간·파일 목록을 확인합니다. 전송 결과가 불분명하면 재전송 전에 상태부터 조회합니다.</p></section></main><script>const expected="830c1620abd5047078862c2e368ce0610a445bf501574d0370310d7bc5c3ac8a";let receipt=null;const $=s=>document.querySelector(s);$('#upload').onchange=async()=>{const f=$('#upload').files[0];if(!f)return;const a=await f.arrayBuffer();const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',a))].map(v=>v.toString(16).padStart(2,'0')).join('');$('#submit').disabled=h!==expected;$('#file-status').textContent=h===expected?'교육용 최종 파일과 일치합니다.':'다른 파일입니다. 제공된 teaching-package.zip을 선택해 주세요.';};document.querySelector('form').onsubmit=e=>{e.preventDefault();if($('#submit').disabled)return;receipt={status:'LOCAL_DEMO_RECEIPT',real_journal_submission:false,uploaded_to_server:false,title:$('#title').value,package_sha256:expected,time_utc:new Date().toISOString(),receipt_id:'PRACTICE-'+crypto.randomUUID()};$('#receipt-text').textContent=JSON.stringify(receipt,null,2);$('#receipt').hidden=false;$('#submit').disabled=true;$('#submit').textContent='연습 완료';};$('#save').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='LOCAL_DEMO_RECEIPT.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};</script></body></html>
