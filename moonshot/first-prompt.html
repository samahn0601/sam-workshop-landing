<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 첫 연구 요청</title><style>*{box-sizing:border-box}html{background:#f7f5ee;color:#19343c;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}body{margin:0}main{max-width:1120px;margin:auto;padding:40px 28px 90px}header{display:flex;justify-content:space-between;gap:25px;align-items:center;padding:20px 0;border-bottom:1px solid #cfd9d2}header a{font-weight:700}a{color:#206f65;text-underline-offset:5px}h1{font-size:clamp(36px,5vw,64px);line-height:1.27;letter-spacing:-2.2px;font-weight:800;margin:24px 0}h2{font-size:29px;letter-spacing:-.8px}h3{font-size:21px}p,li{font-size:18px;line-height:1.8;word-break:keep-all}small,.small{font-size:14px;line-height:1.7;color:#567167}button,.btn{border:1px solid #bfd0c6;background:#fffdf8;color:#1b4941;padding:14px 23px;border-radius:8px;font:700 17px/1.4 inherit;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:#237c72!important;color:#fff!important;border-color:#237c72!important}button:focus-visible,a:focus-visible{outline:3px solid #bb6f4e;outline-offset:4px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.eyebrow{font-size:14px;letter-spacing:2px;color:#237c72;font-weight:700}.hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;padding:50px 0}.hero img{width:100%;border-radius:10px}.rule{padding:35px 0;border-top:1px solid #ccd8d1}.two{display:grid;grid-template-columns:1fr 1fr;gap:35px}code{background:#e7ede4;padding:3px 6px;border-radius:3px;font-size:14px}pre{white-space:pre-wrap;font-size:16px;line-height:1.65;background:#fffdf8;border:1px solid #d4ddd4;padding:24px;overflow-wrap:anywhere;border-radius:8px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0}.panel{display:none}.panel.active{display:block}nav button[aria-selected=true]{background:#237c72;color:#fff}table{width:100%;border-collapse:collapse;font-size:17px}td,th{border-bottom:1px solid #cfdbd1;text-align:left;padding:15px}figure{margin:25px 0}figure img{width:100%;height:auto}.label{color:#236e63;font-weight:700}.callout{border-left:4px solid #ba7255;padding:8px 22px;background:#efeade}.note{background:#e7efe7;padding:20px;border-radius:8px}.files a{display:block;padding:10px 0}.prompt{width:100%;min-height:180px;font:17px/1.7 inherit;padding:20px;background:#fffdf8;border:1px solid #cbd9cd}label{display:block;margin:18px 0;font-size:17px}input[type=text]{display:block;width:100%;font:17px/1.5 inherit;padding:14px;border:1px solid #bfd0c6;margin-top:9px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}footer{border-top:1px solid #cfdbd3;padding-top:24px;margin-top:50px;font-size:13px;color:#587067}[hidden]{display:none!important}@media(max-width:650px){main{padding:20px 18px 60px}.hero,.two{grid-template-columns:1fr;gap:18px}.hero{padding:20px 0}.hero img{max-height:260px;object-fit:cover}header{font-size:13px}p,li{font-size:16px}h1{font-size:37px}nav button{font-size:14px;padding:9px 12px}pre{font-size:14px;padding:16px}td,th{padding:9px;font-size:14px}}</style></head><body><main><header><a href="index.html">← 자료실</a><span>일반 채팅에서도 시작</span></header><h1>내가 궁금한 이유부터<br>AI에게 알려 줍니다.</h1><p>대괄호를 내 말로 채워 보세요. 아직 모르는 것은 모른다고 쓰면 됩니다. 답을 찾으면 누구와 이야기하고 싶은지도 적어 봅니다.</p><textarea id="prompt" class="prompt" style="height:380px">나는 [전공/관심 분야] 학생이고, [궁금한 장면]을 알아보고 싶어.
이게 궁금한 이유는 [내 이유]이고, 알게 되면 [누구]에게 보여 주고 싶어.
지금 내 예상은 [내 생각 한 줄]이야. 다른 설명도 함께 찾아보자.
현재 가진 자료는 [없음 / 공개 자료 / 설문 / 면담 / 내 자료]야.
먼저 내 질문이 너무 넓은지 봐 줘. 답을 지어내기 전에 꼭 필요한 것만 물어봐.
질문 후보 3개, 각 질문에 필요한 자료와 방법, 지금은 말할 수 없는 결론을 표로 비교해 줘.
내가 고르면 research-brief.md와 claims.csv 초안을 만들어 줘.
읽지 않은 원문을 확인했다고 쓰거나, 실제로 실행하지 않은 숫자를 결과로 만들지 마.
마지막에는 내가 할 결정 하나와 다음 요청 문장을 알려 줘.</textarea><div class="actions"><button class="primary" id="copy">요청 문장 복사</button><a class="btn" href="research-brief.md" download>내 연구 메모 받기</a></div><p id="status" role="status"></p></main><script>document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#prompt').value);document.querySelector('#status').textContent='복사했습니다.';}catch{document.querySelector('#prompt').select();document.querySelector('#status').textContent='선택된 문장을 복사해 주세요.';}};</script></body></html>
